<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Santé Pickleball 場地預約</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;600&family=Jost:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#0e0b12;--line:#3a2a44;--pink:#e8aebe;--court:#e0629a;--purple:#4a2a7a;--text:#f3e4ea;--mute:#a58f9a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.6 "Jost","Noto Sans TC",system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 120px}
header{position:relative;text-align:center;padding:36px 0 24px}
.logo{width:150px;height:150px;border:1.5px solid var(--pink);border-radius:50%;margin:0 auto 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.logo .ball{width:20px;height:20px}
.logo b{font:600 34px/1 "Bodoni Moda",Georgia,serif;letter-spacing:.14em;color:var(--pink);margin-top:6px}
.logo i{font:300 9px/1 "Jost",sans-serif;letter-spacing:.42em;color:var(--pink);font-style:normal;margin-top:6px}
h1{font:500 24px/1.3 "Bodoni Moda","Noto Sans TC",serif;margin:0 0 6px;letter-spacing:.04em}
header p{margin:0;color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;margin-bottom:20px}
h2{font:500 18px/1.3 "Noto Sans TC",sans-serif;margin:0 0 12px;letter-spacing:.06em}
input,textarea{background:#000;border:1px solid var(--line);color:var(--text);padding:11px 14px;font:inherit;border-radius:4px;min-width:0}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row input{flex:1 1 200px}
button{font:inherit;cursor:pointer;border-radius:4px}
.btn{background:var(--court);color:#fff;border:0;padding:11px 22px;font-weight:500;letter-spacing:.06em}
.btn:hover{background:#ea78ab}
.ghost{background:none;color:var(--pink);border:1px solid var(--pink);padding:8px 14px}
.ghost:hover{background:#e8aebe22}
.msg{margin:10px 0 0;color:var(--pink);min-height:1.4em}
.err{color:#ff9aa8}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.adm{position:absolute;top:14px;right:0;padding:6px 12px;font-size:13px}
textarea{width:100%;min-height:96px;resize:vertical}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:13px;margin-bottom:12px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line)}
.legend .l1::before{background:#e0629a33;border-color:var(--court)}
.legend .l2::before{background:var(--court)}
.legend .l3::before{background:var(--purple);border-color:#7a52b0}
.legend .l4::before{background:repeating-linear-gradient(45deg,#1a1320 0 3px,#000 3px 6px)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
.grid{display:grid;grid-template-columns:56px repeat(7,minmax(68px,1fr));min-width:560px}
.grid>div,.grid>button{border-right:1px solid #1d1524;border-bottom:1px solid #1d1524;height:34px;font-size:12px}
.hd{height:auto!important;padding:8px 2px;text-align:center;background:#150f1b;position:sticky;top:0}
.hd small{display:block;color:var(--mute)}
.tm{color:var(--mute);text-align:right;padding:8px 8px 0 0;position:sticky;left:0;background:var(--bg)}
.s{border:0;background:#e0629a22;color:transparent}
.s:hover{background:#e0629a66}
.s.sel{background:var(--court);color:#fff}
.s.mine{background:#7a52b0;color:#fff}
.s.taken{background:var(--purple);cursor:not-allowed;color:#b9a3d6}
.s.off{background:repeating-linear-gradient(45deg,#1a1320 0 3px,#000 3px 6px);cursor:not-allowed}
.s.past{background:#000;cursor:not-allowed}
.checkout{position:fixed;left:0;right:0;bottom:0;background:#0e0b12;border-top:1px solid var(--pink);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:none}
.checkout.on{display:block}
.checkout div{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{text-align:left;padding:9px 6px;border-bottom:1px solid #1d1524;vertical-align:middle}
th{color:var(--mute);font-weight:400}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;border:1px solid var(--pink);color:var(--pink)}
.tag.ok{background:var(--court);border-color:var(--court);color:#fff}
.tblwrap{overflow-x:auto}
footer{text-align:center;color:var(--mute);font-size:12px;padding:10px 0 30px}
footer button{background:none;border:0;color:var(--mute);text-decoration:underline}
@media (prefers-reduced-motion:no-preference){.s{transition:background .12s}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <button class="ghost adm" data-act="admin">管理後台</button>
  <div class="logo" role="img" aria-label="Santé Pickleball">
    <svg class="ball" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9.5" fill="#e8aebe"/><g fill="#000"><circle cx="10" cy="5" r="1.3"/><circle cx="6" cy="8" r="1.3"/><circle cx="14" cy="8" r="1.3"/><circle cx="10" cy="11" r="1.3"/><circle cx="6" cy="14" r="1.3"/><circle cx="14" cy="14" r="1.3"/></g></svg>
    <b>Santé</b><i>PICKLEBALL</i>
  </div>
  <h1>場地預約</h1>
  <p>每格 30 分鐘 · 需先通過申請開通</p>
</header>
<div id="app"></div>
<footer><button data-act="admin">管理後台</button></footer>
</div>
<div class="checkout" id="co"><div><span id="cosum"></span><button class="btn" data-act="book">預約並前往刷卡奉獻</button></div></div>

<script>
// ===== 設定（請依實際情況修改）=====
const CFG={
  PRICE:100,                 // 每 30 分鐘奉獻金額（元）
  PAYMENT_URL:'https://fightk.org/Dedications', // 教會刷卡奉獻系統網址
  ADMIN_PIN:'0000',          // 後台密碼（示範用）
  WEEKS:4                    // 可預約未來幾週
};
const OPEN=540,CLOSE=1260; // 09:00–21:00
const BLOCK={3:[540,720],4:[540,720],5:[1200,1320],6:[1020,1320]}; // 週三四 09–12、週五 20–22、週六 17–22
const DN=['日','一','二','三','四','五','六'];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={phone:null,week:0,sel:{date:null,mins:[]},admin:false,msg:'',bad:false,
  wl:store.get('sp_wl',[]),bk:store.get('sp_bk',[])};
const save=()=>{store.set('sp_wl',S.wl);store.set('sp_bk',S.bk)};
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const fm=m=>pad(m/60|0)+':'+pad(m%60);
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const blocked=(dow,m)=>{const r=BLOCK[dow];return r&&m>=r[0]&&m<r[1]};
const normPhone=v=>v.replace(/[\s\-]/g,'');
const okPhone=v=>/^09\d{8}$/.test(v);
function ranges(mins){const a=[...mins].sort((x,y)=>x-y),o=[];let s=null,p=null;for(const m of a){if(s===null){s=p=m}else if(m===p+30){p=m}else{o.push([s,p+30]);s=p=m}}if(s!==null)o.push([s,p+30]);return o.map(r=>fm(r[0])+'–'+fm(r[1])).join('、')}
function taken(){const t={};S.bk.forEach(b=>b.mins.forEach(m=>t[b.date+' '+m]=b));return t}
function monday(w){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+w*7);return d}

function render(){
  const a=$('#app');
  if(S.admin){a.innerHTML=adminView();co();return}
  if(S.askpin){
    a.innerHTML=`<div class="card"><h2>管理後台</h2><div class="row"><input id="pin" type="password" placeholder="請輸入後台密碼" autocomplete="off"><button class="btn" data-act="pinok">進入後台</button><button class="ghost" data-act="pincancel">返回</button></div><p class="msg ${S.bad?'err':''}">${S.msg}</p></div>`;
    co();return;
  }
  if(!S.phone){
    a.innerHTML=`<div class="card"><h2>輸入手機號碼</h2>
    <div class="row"><input id="ph" inputmode="numeric" placeholder="0912345678" autocomplete="tel" value="${store.get('sp_last','')}"><button class="btn" data-act="login">查詢預約資格</button></div>
    <p class="msg ${S.bad?'err':''}">${S.msg}</p>
    <p style="color:var(--mute);margin:8px 0 0;font-size:13px">尚未開通？請向 Santé 櫃檯申請，通過後即可預約。</p></div>`;
    co();return;
  }
  a.innerHTML=calView()+mineView();co();
}
function calView(){
  const mon=monday(S.week),t=taken(),now=new Date();
  let h=`<div class="card"><div class="bar"><h2 style="margin:0">預約時段　<small style="color:var(--mute);font-weight:400">${S.phone}</small></h2><button class="ghost" data-act="logout">切換號碼</button></div>
  <div class="bar"><button class="ghost" data-act="prev" ${S.week<=0?'disabled style="opacity:.3"':''}>上一週</button><strong>${mon.getMonth()+1}/${mon.getDate()} 起</strong><button class="ghost" data-act="next" ${S.week>=CFG.WEEKS-1?'disabled style="opacity:.3"':''}>下一週</button></div>
  <div class="legend"><span class="l1">可預約</span><span class="l2">已選</span><span class="l3">已被預約</span><span class="l4">不開放</span></div>
  <p class="msg ${S.bad?'err':''}">${S.msg}</p>
  <div class="scroll"><div class="grid"><div class="hd"></div>`;
  const days=[];
  for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);days.push(d);h+=`<div class="hd">週${DN[d.getDay()]}<small>${d.getMonth()+1}/${d.getDate()}</small></div>`}
  for(let m=OPEN;m<CLOSE;m+=30){
    h+=`<div class="tm">${m%60===0?fm(m):''}</div>`;
    for(const d of days){
      const k=ds(d),start=new Date(d);start.setHours(m/60|0,m%60);
      const b=t[k+' '+m],sel=S.sel.date===k&&S.sel.mins.includes(m);
      let c='s',lab=fm(m)+' ',dis='';
      if(start<now){c+=' past';dis='disabled'}
      else if(blocked(d.getDay(),m)){c+=' off';dis='disabled';lab+='不開放'}
      else if(b){c+=b.phone===S.phone?' mine':' taken';dis='disabled';lab+=b.phone===S.phone?'我的預約':'已預約';}
      else if(sel){c+=' sel';lab+='已選'}
      else lab+='可預約';
      h+=`<button class="${c}" ${dis} data-act="slot" data-d="${k}" data-m="${m}" aria-label="${k} ${lab}">${b&&b.phone===S.phone?'我':sel?'✓':''}</button>`;
    }
  }
  return h+`</div></div></div>`;
}
function mineView(){
  const my=S.bk.filter(b=>b.phone===S.phone).sort((a,b)=>a.date<b.date?-1:1);
  if(!my.length)return `<div class="card"><h2>我的預約</h2><p style="color:var(--mute);margin:0">還沒有預約，請在上方選擇時段。</p></div>`;
  return `<div class="card"><h2>我的預約</h2><div class="tblwrap"><table><tr><th>日期</th><th>時段</th><th>奉獻</th><th>狀態</th><th></th></tr>`+
  my.map(b=>`<tr><td>${b.date}</td><td>${ranges(b.mins)}</td><td>$${b.mins.length*CFG.PRICE}</td><td><span class="tag ${b.paid?'ok':''}">${b.paid?'已完成':'待奉獻'}</span></td><td>${b.paid?'':`<button class="ghost" data-act="paid" data-id="${b.id}">我已完成奉獻</button> `}<button class="ghost" data-act="cancel" data-id="${b.id}">${S.cf===b.id?'確定取消？':'取消'}</button></td></tr>`).join('')+`</table></div></div>`;
}
function adminView(){
  const bk=[...S.bk].sort((a,b)=>a.date<b.date?-1:1);
  return `<div class="card"><div class="bar"><h2 style="margin:0">管理後台</h2><button class="ghost" data-act="exit">返回預約頁</button></div>
  <h2>開通手機號碼</h2><textarea id="nw" placeholder="輸入通過申請者的手機號碼，可一次貼上多筆（用換行或逗號分隔）&#10;0912345678&#10;0922333444"></textarea><div class="row" style="margin-top:10px"><button class="btn" data-act="wladd">開通這些號碼</button></div>
  <p class="msg ${S.bad?'err':''}">${S.msg}</p>
  <div class="tblwrap"><table><tr><th>已開通號碼</th><th></th></tr>${S.wl.map(p=>`<tr><td>${p}</td><td><button class="ghost" data-act="wldel" data-p="${p}">停用</button></td></tr>`).join('')||'<tr><td colspan="2" style="color:var(--mute)">尚無開通號碼</td></tr>'}</table></div></div>
  <div class="card"><h2>所有預約</h2><div class="tblwrap"><table><tr><th>手機</th><th>日期</th><th>時段</th><th>狀態</th><th></th></tr>${bk.map(b=>`<tr><td>${b.phone}</td><td>${b.date}</td><td>${ranges(b.mins)}</td><td><span class="tag ${b.paid?'ok':''}">${b.paid?'已完成':'待奉獻'}</span></td><td>${b.paid?'':`<button class="ghost" data-act="paid" data-id="${b.id}">標記已奉獻</button> `}<button class="ghost" data-act="cancel" data-id="${b.id}">${S.cf===b.id?'確定取消？':'取消'}</button></td></tr>`).join('')||'<tr><td colspan="5" style="color:var(--mute)">尚無預約</td></tr>'}</table></div></div>`;
}
function co(){
  const e=$('#co'),n=S.sel.mins.length;
  if(S.phone&&!S.admin&&n){e.classList.add('on');$('#cosum').textContent=`${S.sel.date}　${ranges(S.sel.mins)}　共 ${n} 格　奉獻 $${n*CFG.PRICE}`}
  else e.classList.remove('on');
}
const say=(m,bad)=>{S.msg=m;S.bad=!!bad};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;say('');if(a!=='cancel')S.cf=null;
  if(a==='login'){
    const p=normPhone($('#ph').value);
    if(!okPhone(p))say('請輸入 10 碼手機號碼（09 開頭）',1);
    else if(!S.wl.includes(p))say('此號碼尚未開通預約資格，請先向櫃檯申請。',1);
    else{S.phone=p;store.set('sp_last',p)}
  }
  else if(a==='logout'){S.phone=null;S.sel={date:null,mins:[]}}
  else if(a==='prev')S.week--;
  else if(a==='next')S.week++;
  else if(a==='slot'){
    const d=el.dataset.d,m=+el.dataset.m;
    if(S.sel.date!==d)S.sel={date:d,mins:[]};
    const i=S.sel.mins.indexOf(m);i>=0?S.sel.mins.splice(i,1):S.sel.mins.push(m);
  }
  else if(a==='book'){
    const t=taken(),{date,mins}=S.sel;
    if(mins.some(m=>t[date+' '+m])){say('部分時段剛被預約，請重新選擇。',1);S.sel={date:null,mins:[]}}
    else{
      S.bk.push({id:Date.now().toString(36),phone:S.phone,date,mins:[...mins],paid:false});save();
      say(CFG.PAYMENT_URL?'時段已保留，請在教會刷卡奉獻頁完成奉獻後，回來按「我已完成奉獻」。':'時段已保留。（尚未設定奉獻系統網址，請聯絡管理員。）');
      S.sel={date:null,mins:[]};
      if(CFG.PAYMENT_URL)window.open(CFG.PAYMENT_URL,'_blank','noopener');
    }
  }
  else if(a==='paid'){const b=S.bk.find(x=>x.id===el.dataset.id);if(b){b.paid=true;save()}}
  else if(a==='cancel'){if(S.cf===el.dataset.id){S.bk=S.bk.filter(x=>x.id!==el.dataset.id);save();S.cf=null}else S.cf=el.dataset.id}
  else if(a==='admin'){S.askpin=true}
  else if(a==='pinok'){if($('#pin').value===CFG.ADMIN_PIN){S.admin=true;S.askpin=false}else say('密碼錯誤',1)}
  else if(a==='pincancel')S.askpin=false;
  else if(a==='exit'){S.admin=false;S.askpin=false}
  else if(a==='wladd'){
    const list=$('#nw').value.split(/[\n,、;，]+/).map(normPhone).filter(Boolean);
    const bad=list.filter(x=>!okPhone(x)),ok=[...new Set(list.filter(okPhone))].filter(x=>!S.wl.includes(x));
    S.wl.push(...ok);save();
    say(!list.length?'請輸入手機號碼':(ok.length?`已開通 ${ok.length} 個號碼。`:'沒有新增號碼。')+(bad.length?` 格式錯誤未加入：${bad.join('、')}`:''),!ok.length||bad.length);
  }
  else if(a==='wldel'){S.wl=S.wl.filter(p=>p!==el.dataset.p);save()}
  render();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pin')document.querySelector('[data-act=pinok]').click();if(e.key==='Enter'&&e.target.id==='ph')document.querySelector('[data-act=login]').click();});
render();
</script>
</body>
</html>
